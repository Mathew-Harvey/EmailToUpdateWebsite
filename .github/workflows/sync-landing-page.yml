name: Sync Landing Page

on:
  push:
    branches: [master, main]
    paths:
      - 'landing/**'

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Checkout landing page repo
        uses: actions/checkout@v4
        with:
          repository: Mathew-Harvey/EmailToUpdateMyWebsiteLandingPage
          token: ${{ secrets.LANDING_PAGE_PAT }}
          path: landing-repo

      - name: Sync landing files
        run: |
          # Copy landing page files to the landing page repo
          cp -f landing/* landing-repo/

          cd landing-repo

          # Check if there are any changes
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit and push
          git add -A
          git commit -m "Sync landing page from EmailToUpdateWebsite"
          git push
